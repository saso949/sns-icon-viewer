<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNS Icon Viewer | SNSアイコン見え方・識別性チェッカー</title>
  <meta name="description" content="複数のSNSアイコン候補画像をアップロードして、X(Twitter)・Instagram・Discord・LINE・YouTubeなどの実際の画面や極小サイズでの見え方・識別性を比較検証できるツール。" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 左サイドバー：アイコン管理・設定パネル -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-logo" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">SNS Icon Viewer</h1>
          <p class="brand-subtitle">複数候補の実画面・極小サイズ比較</p>
        </div>
      </div>

      <!-- アップロードエリア -->
      <section class="panel-section">
        <div class="section-header">
          <h2>1. アイコン候補を追加</h2>
          <span class="badge-hint">Ctrl+V 貼り付け対応</span>
        </div>
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="画像をドラッグ＆ドロップ、またはクリックして選択">
          <input type="file" id="file-input" accept="image/*" multiple hidden />
          <svg class="dropzone-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p class="dropzone-title">画像をドロップ / クリックして選択</p>
          <p class="dropzone-sub">複数枚まとめアップロード可能（ブラウザ内処理・外部送信なし）</p>
        </div>
      </section>

      <!-- 候補リスト -->
      <section class="panel-section candidates-section">
        <div class="section-header">
          <h2>2. 候補一覧 <span id="candidate-count" class="count-pill">0</span></h2>
          <div class="section-actions">
            <button type="button" id="btn-load-samples" class="btn-text" title="サンプルアイコンを再読み込み">サンプル復元</button>
            <button type="button" id="btn-clear-all" class="btn-text danger" title="すべてのアイコンをクリア">全削除</button>
          </div>
        </div>
        <p class="helper-note">クリックで選択（数字キー <code>1</code>〜<code>9</code> でも切替可）。トリミングボタンで位置・拡大率を調整できます。</p>
        <div id="candidate-list" class="candidate-list"></div>
      </section>

      <!-- プロフィール表示名・テキスト設定 -->
      <section class="panel-section">
        <div class="section-header">
          <h2>3. プレビュー用プロフィール設定</h2>
        </div>
        <div class="form-group">
          <label for="input-display-name">表示名 (Display Name)</label>
          <input type="text" id="input-display-name" value="あなた (アイコン検証中)" maxlength="30" />
        </div>
        <div class="form-group">
          <label for="input-handle">ユーザーID (@handle)</label>
          <input type="text" id="input-handle" value="your_account" maxlength="25" />
        </div>
        <div class="form-group">
          <label for="input-post-text">サンプル投稿文</label>
          <textarea id="input-post-text" rows="2" maxlength="140">新しいSNSアイコンどれがいいか迷ってます！タイムラインでパッと見て誰だか分かりやすいのはどれでしょう？🎨✨</textarea>
        </div>
      </section>
    </aside>

    <!-- メインコンテンツエリア -->
    <main class="main-area">
      <!-- 上部ツールバー -->
      <header class="toolbar">
        <div class="toolbar-row">
          <!-- 表示モード切替 -->
          <div class="control-group">
            <span class="control-label">比較モード</span>
            <div class="segmented-control" id="compare-mode-tabs">
              <button type="button" class="seg-btn active" data-mode="mix" title="複数の候補アイコンをタイムライン内に並べて同時比較します">
                <span>タイムライン混在比較</span>
              </button>
              <button type="button" class="seg-btn" data-mode="single" title="選択中の1つのアイコンを全画面に適用して確認します">
                <span>単一アイコン集中確認</span>
              </button>
              <button type="button" class="seg-btn" data-mode="matrix" title="全候補×各ピクセルサイズ×背景色をマトリクス表で比較します">
                <span>サイズ・背景マトリクス表</span>
              </button>
            </div>
          </div>

          <!-- 背景テーマ切替 -->
          <div class="control-group">
            <span class="control-label">SNS背景色</span>
            <div class="segmented-control" id="theme-tabs">
              <button type="button" class="seg-btn active" data-theme="light">
                <span class="theme-dot light-dot"></span>ライト
              </button>
              <button type="button" class="seg-btn" data-theme="dim">
                <span class="theme-dot dim-dot"></span>ディム(紺)
              </button>
              <button type="button" class="seg-btn" data-theme="dark">
                <span class="theme-dot dark-dot"></span>ダーク(黒)
              </button>
            </div>
          </div>
        </div>

        <div class="toolbar-row secondary-row">
          <!-- SNSプラットフォーム切替 (SNSモックアップ表示時) -->
          <div class="control-group" id="platform-filter-group">
            <span class="control-label">表示SNS</span>
            <div class="pill-tabs" id="platform-tabs">
              <button type="button" class="pill-btn active" data-platform="all">すべて表示</button>
              <button type="button" class="pill-btn" data-platform="x">X (Twitter)</button>
              <button type="button" class="pill-btn" data-platform="instagram">Instagram</button>
              <button type="button" class="pill-btn" data-platform="discord">Discord</button>
              <button type="button" class="pill-btn" data-platform="line">LINE</button>
              <button type="button" class="pill-btn" data-platform="youtube">YouTube</button>
            </div>
          </div>

          <!-- 識別性チェックフィルタ -->
          <div class="control-group">
            <span class="control-label">識別性テスト</span>
            <div class="filter-toggles">
              <label class="toggle-chip" title="明度差（コントラスト）だけでアイコンが潰れていないか確認します">
                <input type="checkbox" id="chk-grayscale" />
                <span>白黒(明度)</span>
              </label>
              <label class="toggle-chip" title="流し見や縮小時にシルエットが判別できるか確認します">
                <input type="checkbox" id="chk-blur" />
                <span>ぼかし(シルエット)</span>
              </label>
              <label class="toggle-chip" title="画面を75%縮小して、スマホを少し離して見たときの視認性を確認します">
                <input type="checkbox" id="chk-small-scale" />
                <span>遠目表示(75%)</span>
              </label>
            </div>
          </div>
        </div>
      </header>

      <!-- プレビューキャンバス -->
      <div id="preview-viewport" class="preview-viewport" data-sns-theme="light">
        <!-- クイック候補スイッチャーバー（上部固定でいつでもポチポチ切り替え可能） -->
        <div id="quick-switcher-bar" class="quick-switcher-bar"></div>

        <!-- SNSモックアップグリッド -->
        <div id="sns-mockups-container" class="sns-mockups-grid"></div>

        <!-- サイズ・形状・背景マトリクス比較ビュー -->
        <div id="matrix-view-container" class="matrix-view-container hidden"></div>
      </div>
    </main>
  </div>

  <!-- アイコン位置・拡大率調整モーダル -->
  <div id="crop-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="crop-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="crop-modal-title">アイコンの表示位置・拡大率の調整</h3>
        <button type="button" id="btn-close-modal" class="btn-icon" aria-label="閉じる">&times;</button>
      </div>
      <div class="modal-body">
        <div class="crop-preview-row">
          <div class="crop-stage-wrap">
            <div class="crop-stage" id="crop-stage" title="ドラッグして位置を移動できます">
              <img id="crop-stage-img" src="" alt="プレビュー" draggable="false" />
              <div class="crop-circle-guide"></div>
            </div>
            <span class="crop-caption">128px (ドラッグで移動可)</span>
          </div>
          <div class="crop-mini-previews">
            <div class="mini-preview-item">
              <div class="avatar-frame size-48"><img id="crop-mini-48" src="" alt="" /></div>
              <span>48px</span>
            </div>
            <div class="mini-preview-item">
              <div class="avatar-frame size-32"><img id="crop-mini-32" src="" alt="" /></div>
              <span>32px</span>
            </div>
            <div class="mini-preview-item">
              <div class="avatar-frame size-20"><img id="crop-mini-20" src="" alt="" /></div>
              <span>20px</span>
            </div>
          </div>
        </div>

        <div class="crop-controls">
          <div class="form-group">
            <label for="input-candidate-label">候補ラベル名</label>
            <input type="text" id="input-candidate-label" maxlength="24" />
          </div>
          <div class="slider-group">
            <label for="slider-zoom">拡大率 (Zoom): <strong id="val-zoom">100%</strong></label>
            <input type="range" id="slider-zoom" min="100" max="300" step="2" value="100" />
          </div>
          <div class="slider-group">
            <label for="slider-pan-x">左右位置 (X): <strong id="val-pan-x">0%</strong></label>
            <input type="range" id="slider-pan-x" min="-100" max="100" step="1" value="0" />
          </div>
          <div class="slider-group">
            <label for="slider-pan-y">上下位置 (Y): <strong id="val-pan-y">0%</strong></label>
            <input type="range" id="slider-pan-y" min="-100" max="100" step="1" value="0" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="btn-reset-crop" class="btn-secondary">位置をリセット</button>
        <div class="modal-footer-right">
          <button type="button" id="btn-export-cropped" class="btn-secondary">切り抜きPNGを保存</button>
          <button type="button" id="btn-save-crop" class="btn-primary">完了</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
